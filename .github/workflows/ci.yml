name: CI & Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-and-test:
    name: Lint, Test & Empirical Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libasound2-dev pkg-config llvm-dev libclang-dev clang
          # Remove local Fedora-specific cargo config for clean Ubuntu build
          rm -f .cargo/config.toml

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Dependency Invariant Audit
        run: ./scripts/audit_dependencies.sh

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Cargo Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit & Integration Tests
        run: cargo test --workspace -- --nocapture

      - name: Empirical Invariant Challenges
        run: |
          python3 tests/empirical_challenge/test_demux_codecs_clock.py
          python3 tests/empirical_challenge/test_sync_engine.py
          python3 tests/empirical_challenge/test_smart_chat.py
          python3 tests/empirical_challenge/test_ui_renderer.py

      - name: Intent Verification Harness
        run: python3 scripts/intent_harness.py
