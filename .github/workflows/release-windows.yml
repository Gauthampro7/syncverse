name: Windows Release & Installer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Local Cargo Config for Cross-Platform Build
        shell: powershell
        run: |
          # Remove local Linux-specific .cargo/config.toml if present
          if (Test-Path ".cargo\config.toml") {
            Remove-Item -Force ".cargo\config.toml"
            Write-Host "Removed Linux-specific .cargo/config.toml for Windows build"
          }

      - name: Setup LLVM / libclang
        shell: powershell
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") {
            Write-Host "Found pre-installed LLVM at C:\Program Files\LLVM\bin"
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "Installing LLVM via chocolatey..."
            choco install llvm -y --no-progress
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Install FFmpeg Development Libraries
        shell: powershell
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Write-Host "Downloading FFmpeg from $ffmpegUrl..."
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-dist
          $ffmpegDir = (Get-Item "ffmpeg-dist\ffmpeg-master-*-win64-gpl-shared").FullName
          Write-Host "Resolved FFMPEG_DIR: $ffmpegDir"
          # Remove hwcontext_cuda.h to prevent bindgen from parsing unreleased CUDA structs in FFmpeg master
          Remove-Item "$ffmpegDir\include\libavutil\hwcontext_cuda.h" -Force -ErrorAction SilentlyContinue
          "FFMPEG_DIR=$ffmpegDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$ffmpegDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile Release Binary
        shell: powershell
        run: |
          cargo build --release --bin syncplay-alt

      - name: Stage Runtime DLLs
        shell: powershell
        run: |
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" -Destination "target\release\" -Force

      - name: Build Inno Setup Installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - name: Compute SHA-256 Checksums
        shell: powershell
        run: |
          Get-FileHash -Path target\windows-dist\*.exe -Algorithm SHA256 | Out-File -FilePath target\windows-dist\SHA256SUMS.txt
          Get-Content target\windows-dist\SHA256SUMS.txt

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            target/windows-dist/*.exe
            target/windows-dist/SHA256SUMS.txt

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/windows-dist/*.exe
            target/windows-dist/SHA256SUMS.txt
          generate_release_notes: true
