[workspace]
members = [
    "crates/syncverse-common",
    "crates/syncverse-demux",
    "crates/syncverse-codecs",
    "crates/syncverse-clock",
    "crates/syncverse-sync",
    "crates/syncverse-chat",
    "crates/syncverse-ui",
    "crates/syncverse-core",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["Gautham <gautham@syncverse.internal>"]
license = "MIT"
repository = "https://github.com/Gauthampro7/syncverse"
description = "Ultra-efficient standalone desktop media player and long-distance synchronized watch-party platform in pure Rust"

[workspace.dependencies]
thiserror = "2.0"
ffmpeg-next = "9.0.0"

