[workspace]
members = [
    "crates/syncplay-common",
    "crates/syncplay-demux",
    "crates/syncplay-codecs",
    "crates/syncplay-clock",
    "crates/syncplay-sync",
    "crates/syncplay-chat",
    "crates/syncplay-ui",
    "crates/syncplay-core",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Gautham <gautham@syncplay-alt.internal>"]
